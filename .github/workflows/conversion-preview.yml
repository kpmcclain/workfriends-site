name: Workfriends conversion preview
on:
  push:
    branches: [workfriends-conversion-preview-20261019]
    paths:
      - '.github/workflows/conversion-preview.yml'
      - 'tools/build_conversion_preview.py'
      - 'tools/conversion_preview_content.json'
      - 'tests/site_preview_browser.py'
permissions:
  contents: write
concurrency:
  group: workfriends-conversion-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/workfriends-conversion-preview-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workfriends-conversion-preview-20261019
          fetch-depth: 2
      - name: Build and validate isolated preview
        shell: bash
        run: |
          if [ -f tools/build_conversion_preview.py ] && [ -f tools/conversion_preview_content.json ]; then
            python3 tools/build_conversion_preview.py
            python3 tests/validate_public_content.py
            git config user.name "Workfriends preview builder"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html' '*.xml' '*.txt' 'assets/*.css' 'assets/*.js' 'README.md' 'tests/*.py' 'tools/conversion_preview_content.json'
            if ! git diff --cached --quiet; then
              git commit -m "Build warm-prospect conversion preview; production unchanged"
              git push origin HEAD:workfriends-conversion-preview-20261019
            fi
          fi
      - name: Browser checks when test is present
        shell: bash
        run: |
          if [ -f tests/site_preview_browser.py ] && [ -f agency-channel-build/index.html ]; then
            python3 -m pip install playwright
            python3 -m playwright install --with-deps chromium
            python3 tests/site_preview_browser.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workfriends-conversion-preview-source
          path: |
            *.html
            *.json
            *.txt
            *.xml
            README.md
            assets/
            */index.html
            tests/
            tools/
            preview-checks/
          retention-days: 7
