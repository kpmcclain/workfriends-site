name: Workfriends conversion preview
on:
  push:
    branches: [workfriends-conversion-preview-20261019]
    paths:
      - '.github/workflows/conversion-preview.yml'
      - 'tools/build_conversion_preview.py'
      - 'tools/conversion_preview_content.json'
permissions:
  contents: write
jobs:
  preview:
    if: github.ref == 'refs/heads/workfriends-conversion-preview-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workfriends-conversion-preview-20261019
          fetch-depth: 2
      - name: Build approved conversion preview when source is present
        shell: bash
        run: |
          if [ -f tools/build_conversion_preview.py ]; then
            python3 tools/build_conversion_preview.py
            git config user.name "Workfriends preview builder"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html' '*.xml' '*.txt' 'assets/*.css' 'assets/*.js' 'README.md'
            if ! git diff --cached --quiet; then
              git commit -m "Build warm-prospect conversion preview; production unchanged"
              git push origin HEAD:workfriends-conversion-preview-20261019
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: workfriends-conversion-preview-source
          path: |
            *.html
            *.json
            *.txt
            *.xml
            README.md
            assets/
            */index.html
            tests/
            tools/
          retention-days: 7
