name: Workfriends copy preview
on:
  push:
    branches: [workfriends-copy-review-20261020]
    paths:
      - '.github/workflows/copy-review.yml'
      - 'tools/apply_copy_review.py'
permissions:
  contents: write
concurrency:
  group: workfriends-copy-review-20261020
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/workfriends-copy-review-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workfriends-copy-review-20261020
          fetch-depth: 0
      - name: Install validation tools
        run: |
          python3 -m pip install --quiet beautifulsoup4==4.14.3 playwright==1.64.0
          python3 -m playwright install --with-deps chromium >/tmp/workfriends-browser-install.log 2>&1 || { tail -40 /tmp/workfriends-browser-install.log; exit 1; }
      - name: Apply exact requested edits and check preservation
        run: python3 tools/apply_copy_review.py
      - name: Existing static checks
        run: python3 tests/validate_public_content.py
      - name: Existing browser and intercepted form checks
        run: python3 tests/site_preview_browser.py
      - name: Commit validated public files to preview only
        run: |
          rm -f tools/apply_copy_review.py .github/workflows/copy-review.yml
          git config user.name 'Workfriends preview editor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'Apply exact homepage copy and sitewide consistency for review'
          git push origin HEAD:workfriends-copy-review-20261020
          git rev-parse HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workfriends-copy-review-checks
          path: preview-checks/
          retention-days: 7
