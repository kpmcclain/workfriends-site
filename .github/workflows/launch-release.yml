name: Workfriends launch acceptance
on:
  push:
    branches: [workfriends-conversion-preview-20261019]
    paths:
      - '.github/workflows/launch-release.yml'
      - 'tools/finalize_launch.py'
permissions:
  contents: write
concurrency:
  group: workfriends-final-launch
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/workfriends-conversion-preview-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: workfriends-conversion-preview-20261019
          fetch-depth: 2
      - name: Install isolated validation dependencies
        run: |
          python3 -m pip install --quiet beautifulsoup4==4.14.3 playwright
          python3 -m playwright install --with-deps chromium >/tmp/workfriends-browser-install.log 2>&1 || { tail -60 /tmp/workfriends-browser-install.log; exit 1; }
      - name: Apply final editorial and release cleanup
        run: python3 tools/finalize_launch.py
      - name: Static content regression
        run: python3 tests/validate_public_content.py
      - name: Desktop, mobile, links and mocked form regression
        run: python3 tests/site_preview_browser.py
      - name: Launch acceptance and readable copy audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re
          root=Path('.')
          assert not (root/'review/index.html').exists()
          assert not (root/'assets/wf-preview.js').exists()
          home=BeautifulSoup((root/'index.html').read_text(),'html.parser')
          assert home.select_one('#scene-panel') is None
          assert not home.select('.world-word')
          assert home.select_one('main').find('section',recursive=False)['id']=='what-we-do'
          assert len(home.select('#what-we-do .buyer-paths article'))==3
          assert '19 years' in home.get_text(' ',strip=True)
          assert 'Build your next' in home.h1.get_text(' ',strip=True)
          offenders=[]
          for path in root.rglob('*.html'):
              doc=BeautifulSoup(path.read_text(),'html.parser')
              for s in doc.select('style,script,svg'):s.decompose()
              text=doc.get_text(' ',strip=True)
              for token in ['All upside. No overhead.','100M+','$1.4B','Commercial Sprint','No new audience or revenue result is guaranteed','Relevant partner compensation is disclosed','This is not a fixed number of introductions','Revenue outcomes depend on']:
                  if token in text:offenders.append([str(path),token])
              for a in doc.select('a[href^="/contact/"]'):
                  assert a.get_text(' ',strip=True).startswith('Discuss a revenue opportunity'),(str(path),a.get_text())
              assert '/assets/wf-preview.js' not in path.read_text()
          assert not offenders,offenders
          for rel in ['index.html','revenue-channels/index.html','agency-channel-build/index.html','creator-commerce/index.html','audience-development/index.html','contact/index.html']:
              doc=BeautifulSoup((root/rel).read_text(),'html.parser')
              for s in doc.select('style,script,svg'):s.decompose()
              main=doc.select_one('main')
              print('\nCOPY_AUDIT',rel)
              print('HEADINGS:',json.dumps([h.get_text(' ',strip=True) for h in doc.select('h1,h2,h3')]))
              print('NOTES:',json.dumps([p.get_text(' ',strip=True) for p in doc.select('.wf-note,.hero-note,.participation-note')]))
          print('LAUNCH_ACCEPTANCE_PASSED; no live inquiries sent.')
          PY
      - name: Commit tested release tree to preview branch only
        run: |
          rm -f tools/finalize_launch.py .github/workflows/launch-release.yml
          git config user.name 'Workfriends release builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add .vercelignore assets/wf-launch.css
          git diff --cached --check
          git commit -m 'Finalize approved Workfriends launch: offer-first, capability-led, clean production tree'
          git push origin HEAD:workfriends-conversion-preview-20261019
          git rev-parse HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workfriends-final-launch-checks
          path: preview-checks/
          retention-days: 7
